<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Nursing home fire safety</title><desc id="desc">A bright illustration of a smoke detector, fire alarm, and safety chart.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7f6f7"/><stop offset="1" stop-color="#fdf3e6"/></linearGradient></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<circle cx="1010" cy="85" r="110" fill="#f6c078" opacity=".3"/><circle cx="95" cy="450" r="140" fill="#8dcbd1" opacity=".25"/>
<text x="64" y="78" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#176b87">FIRE SAFETY INSPECTIONS</text>
<text x="64" y="132" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#182331">Finding patterns before</text>
<text x="64" y="174" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#182331">small deficiencies become major risks</text>
