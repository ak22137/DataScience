  <text x="815" y="210" font-family="Arial, sans-serif" font-size="38" fill="#0f172a" font-weight="700">Safety Checklist</text>
  <g font-family="Arial, sans-serif" font-size="30" fill="#1e293b">
    <text x="815" y="270">✓ Smoke detector testing</text>
    <text x="815" y="320">✓ Exit routes clear</text>
    <text x="815" y="370">✓ Alarm panel inspection</text>
