<g font-family="Arial,sans-serif" font-size="16" fill="#34475a"><text x="64" y="91">Smoke detector signal</text><text x="64" y="137">Alarm system</text><text x="64" y="183">Exit routes</text></g>
<g stroke="#a5c2cb" stroke-width="3" fill="none"><rect x="25" y="69" width="22" height="22" rx="5"/><rect x="25" y="115" width="22" height="22" rx="5"/><rect x="25" y="161" width="22" height="22" rx="5"/></g>
<path d="M29 79l6 6 10-13M29 125l6 6 10-13" stroke="#23866c" stroke-width="4" fill="none" stroke-linecap="round"/>
<rect x="28" y="205" width="410" height="12" rx="6" fill="#e8eef1"/><rect x="28" y="205" width="270" height="12" rx="6" fill="#2b9b91"/>
