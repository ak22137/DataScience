<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Nursing home fire safety thumbnail</title>
  <desc id="desc">Illustrated fire alarm, smoke detector, and safety checklist over a corridor background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2742"/>
      <stop offset="100%" stop-color="#1b4f72"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="100%" stop-color="#e8eef7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="90" width="1120" height="540" rx="28" fill="#ffffff10" stroke="#ffffff33"/>

  <rect x="140" y="140" width="360" height="440" rx="22" fill="url(#card)"/>
  <circle cx="320" cy="245" r="78" fill="#dc2626"/>
  <circle cx="320" cy="245" r="56" fill="#fca5a5"/>
  <rect x="292" y="325" width="56" height="132" rx="20" fill="#111827"/>
  <rect x="210" y="470" width="220" height="58" rx="14" fill="#fee2e2" stroke="#ef4444"/>
  <text x="320" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#991b1b" font-weight="700">ALARM</text>

  <circle cx="650" cy="220" r="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="6"/>
  <circle cx="650" cy="220" r="16" fill="#ef4444"/>
  <path d="M650 130 C620 168 616 222 650 258 C684 222 680 168 650 130Z" fill="#f97316" opacity="0.85"/>

