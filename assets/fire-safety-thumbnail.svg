<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Nursing home fire safety</title>
  <desc id="desc">A bright illustration of a smoke detector, fire alarm, and safety chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#2f6fed"/></linearGradient>
    <linearGradient id="fire" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffcf5c"/><stop offset="1" stop-color="#f05d23"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1050" cy="130" r="210" fill="#ffffff" opacity=".08"/>
  <circle cx="1120" cy="610" r="280" fill="#ffffff" opacity=".06"/>
  <rect x="84" y="96" width="1112" height="528" rx="34" fill="#ffffff" opacity=".96"/>
  <text x="140" y="185" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#132035">FIRE SAFETY INSPECTIONS</text>
  <text x="140" y="232" font-family="Arial, sans-serif" font-size="24" fill="#5f6f86">Finding patterns before small deficiencies become major risks</text>
  <rect x="140" y="300" width="300" height="210" rx="28" fill="#eaf1ff"/>
  <circle cx="290" cy="380" r="66" fill="#ffffff" stroke="#2f6fed" stroke-width="12"/>
  <circle cx="290" cy="380" r="20" fill="#2f6fed"/>
  <path d="M218 448 Q290 500 362 448" fill="none" stroke="#2f6fed" stroke-width="14" stroke-linecap="round"/>
  <path d="M252 290 Q290 250 328 290" fill="none" stroke="#f05d23" stroke-width="12" stroke-linecap="round"/>
  <path d="M272 272 Q290 238 308 272" fill="none" stroke="#ffcf5c" stroke-width="10" stroke-linecap="round"/>
  <text x="182" y="552" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#132035">Smoke detector signal</text>
  <g transform="translate(530 315)">
    <rect x="0" y="170" width="530" height="20" rx="10" fill="#dce4ef"/>
    <rect x="24" y="116" width="70" height="54" rx="8" fill="#70a0ff"/>
    <rect x="132" y="82" width="70" height="88" rx="8" fill="#5d9aff"/>
    <rect x="240" y="48" width="70" height="122" rx="8" fill="#2f6fed"/>
    <rect x="348" y="16" width="70" height="154" rx="8" fill="url(#fire)"/>
    <path d="M24 16 H418" stroke="#b8c7dc" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="0" y="240" font-family="Arial, sans-serif" font-size="22" fill="#5f6f86">Lower</text>
    <text x="366" y="240" font-family="Arial, sans-serif" font-size="22" fill="#5f6f86">Higher risk</text>
  </g>
  <text x="140" y="590" font-family="Arial, sans-serif" font-size="20" fill="#5f6f86">CMS nursing-home fire-safety citation analysis</text>
</svg>
