<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Severity distribution and model metrics</title>
  <desc id="desc">Low-to-moderate cases represent 99.8951 percent, high severity 0.1049 percent, with 97.8595 percent accuracy and 45 percent recall.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#132035">Severity distribution and model evidence</text>
  <text x="50" y="94" font-family="Arial, sans-serif" font-size="18" fill="#5f6f86">Rare-event screening requires recall, not accuracy alone</text>
  <text x="55" y="155" font-family="Arial, sans-serif" font-size="21" fill="#132035">Low-to-moderate: 99.8951%</text>
  <rect x="55" y="175" width="820" height="42" rx="12" fill="#e9f9f1"/><rect x="55" y="175" width="818" height="42" rx="12" fill="#1b7f5f"/>
  <text x="55" y="275" font-family="Arial, sans-serif" font-size="21" fill="#132035">High severity: 0.1049%</text>
  <rect x="55" y="295" width="820" height="42" rx="12" fill="#fff0f0"/><rect x="55" y="295" width="78" height="42" rx="12" fill="#b42318"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#132035">
    <text x="55" y="405">Accuracy</text><text x="330" y="405">97.8595%</text>
    <text x="55" y="460">High-severity recall</text><text x="330" y="460">45%</text>
    <text x="55" y="515">Scenario: CA + smoke + cycle 2 + 20 days</text><text x="55" y="555">Low/moderate 84.78% | High 15.22%</text>
  </g>
</svg>
