<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Severity distribution and model metrics</title><desc id="desc">Low-to-moderate cases represent 99.8951 percent, high severity 0.1049 percent, with 97.8595 percent accuracy and 45 percent recall.</desc>
<rect width="1000" height="560" rx="20" fill="#fbfdfe"/><text x="42" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#182331">Severity distribution and model evidence</text><text x="42" y="82" font-family="Arial,sans-serif" font-size="16" fill="#586879">Rare-event screening requires recall, not accuracy alone</text>
<text x="42" y="135" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#253747">Low-to-moderate: 99.8951%</text><rect x="42" y="151" width="900" height="34" rx="8" fill="#e7eef2"/><rect x="42" y="151" width="899" height="34" rx="8" fill="#2b8b84"/>
<text x="42" y="220" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#253747">High severity: 0.1049%</text><rect x="42" y="236" width="900" height="34" rx="8" fill="#e7eef2"/><rect x="42" y="236" width="8" height="34" rx="4" fill="#d66d3c"/><text x="62" y="258" font-family="Arial,sans-serif" font-size="14" fill="#586879">Rare minority class</text>
<rect x="42" y="305" width="425" height="92" rx="14" fill="#eaf5f8" stroke="#c5e0e6"/><text x="65" y="337" font-family="Arial,sans-serif" font-size="16" fill="#425866">Accuracy</text><text x="65" y="376" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#176b87">97.8595%</text>
<rect x="490" y="305" width="452" height="92" rx="14" fill="#fff4e7" stroke="#f0d2ad"/><text x="513" y="337" font-family="Arial,sans-serif" font-size="16" fill="#72583e">High-severity recall</text><text x="513" y="376" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#b85b2b">45%</text>
<rect x="42" y="420" width="900" height="90" rx="14" fill="#f2f5f7" stroke="#dce4eb"/><text x="64" y="450" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#253747">Scenario: CA + smoke + cycle 2 + 20 days</text><text x="64" y="482" font-family="Arial,sans-serif" font-size="17" fill="#253747">Low/moderate 84.78%  |  High 15.22%</text>
