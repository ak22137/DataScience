<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Most common fire safety deficiency categories</title>
  <desc id="desc">Smoke deficiencies are the largest category with more than 78,000 citations, approximately 39 percent of records.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#132035">Most common deficiency categories</text>
  <text x="50" y="92" font-family="Arial, sans-serif" font-size="18" fill="#5f6f86">Smoke deficiencies are the dominant category</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#132035">
    <text x="55" y="160">Smoke deficiencies</text><text x="55" y="235">Gas / vacuum / electrical</text><text x="55" y="310">Sprinkler / suppression</text><text x="55" y="385">Egress / exit paths</text><text x="55" y="460">Other top categories</text>
  </g>
  <g fill="#7c6ee6">
    <rect x="330" y="135" width="550" height="38" rx="10"/><rect x="330" y="210" width="235" height="38" rx="10"/><rect x="330" y="285" width="155" height="38" rx="10"/><rect x="330" y="360" width="130" height="38" rx="10"/><rect x="330" y="435" width="105" height="38" rx="10"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">
    <text x="780" y="162">78,000+ | ~39%</text><text x="475" y="237">Frequent</text><text x="400" y="312">Recurring</text><text x="375" y="387">Recurring</text><text x="350" y="462">Distributed tail</text>
  </g>
  <line x1="330" y1="505" x2="880" y2="505" stroke="#b8c7dc" stroke-width="2"/>
  <text x="330" y="535" font-family="Arial, sans-serif" font-size="16" fill="#5f6f86">Relative bar length; smoke deficiencies lead the notebook category ranking.</text>
</svg>
